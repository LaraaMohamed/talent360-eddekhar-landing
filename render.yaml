services:
  - type: web
    name: talent360-eddekhar
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: python3 build.py && npm --prefix backend install
    startCommand: node backend/server.js
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://talent360-eddekhar.onrender.com
      - key: TEAM_EMAIL
        value: business-growth@talent-360.me
      - key: MAIL_FROM
        value: Talent360 <business-growth@talent-360.me>
      # Calendar + Gmail through business-growth@'s own Google account (backend/apps-script/README.md)
      - key: APPS_SCRIPT_URL
        sync: false
      - key: APPS_SCRIPT_SECRET
        sync: false
      - key: BUSY_CALENDARS     # a slot shows only when all of these are free
        value: darkawi@talent-360.me
      - key: BOOKING_GUESTS     # invited to every booking alongside the client
        value: business-growth@talent-360.me,bd1@talent-360.me
      - key: CONSULTANT_CALENDAR_ID   # bookings are created on this calendar
        value: darkawi@talent-360.me
      # Optional alternatives to the Apps Script bridge: Gmail SMTP and a Workspace service account
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: business-growth@talent-360.me
      - key: SMTP_PASS          # Google app password for business-growth@ (set in the Render dashboard)
        sync: false
      - key: CONSULTANT_EMAIL   # calendar that receives bookings and creates Meet links
        value: business-growth@talent-360.me
      - key: GOOGLE_SERVICE_ACCOUNT_JSON   # service account with domain-wide delegation, calendar scope
        sync: false
      - key: LINK_SECRET
        generateValue: true
